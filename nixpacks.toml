[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo", "php84Extensions.pdo_sqlite", "php84Extensions.sqlite3", "php84Extensions.mbstring", "php84Extensions.openssl", "php84Extensions.tokenizer", "php84Extensions.xml", "php84Extensions.ctype", "php84Extensions.fileinfo", "php84Extensions.zip", "composer"]

[phases.build]
cmds = ["composer install --optimize-autoloader --no-dev --no-interaction --no-scripts"]

[phases.deploy]
cmds = ["php artisan migrate --force", "php artisan storage:link"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"